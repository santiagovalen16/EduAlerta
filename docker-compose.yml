services:
  postgres:
    image: postgres:16-alpine
    container_name: edualerta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edualerta
      POSTGRES_PASSWORD: edualerta_dev
      POSTGRES_DB: edualerta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edualerta -d edualerta"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: edualerta_api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://edualerta:edualerta_dev@postgres:5432/edualerta?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./apps/web
    container_name: edualerta_web
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: edualerta_nginx
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro

volumes:
  postgres_data:
