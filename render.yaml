services:
  - type: web
    name: edualerta-api
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @edualerta/api exec prisma generate --schema prisma/schema.prisma && pnpm --filter @edualerta/api build
    startCommand: pnpm --filter @edualerta/api exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter @edualerta/api start
    healthCheckPath: /api/public/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: edualerta-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: WEB_URL
        sync: false
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - .nvmrc

  - type: web
    name: edualerta-web
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @edualerta/web build
    startCommand: pnpm --filter @edualerta/web exec next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_URL
        sync: false
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - .node-version
        - .nvmrc

databases:
  - name: edualerta-postgres
    databaseName: edualerta
    user: edualerta
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []
